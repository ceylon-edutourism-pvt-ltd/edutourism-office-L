name: letter_generator_desktop
description: A desktop letter generation application with DOCX templates

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.18.0 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.1
  file_picker: ^5.5.0
  shared_preferences: ^2.2.2
  desktop_window: ^0.4.0
  archive: ^3.4.9
  libre_doc_converter: ^0.1.1  # For DOCX to PDF conversion

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo.png
    - assets/Malaysia Study Tour Invitation.docx
    - assets/Passport Request Letter.docx
